global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'pricing-service'
    static_configs:
      - targets: ['pricing-service:8080']
        labels:
          service: 'pricing-service'

  - job_name: 'nav-calculator-1'
    static_configs:
      - targets: ['nav-calculator-1:8080']
        labels:
          service: 'nav-calculator'
          instance: 'nav-calculator-1'

  - job_name: 'nav-calculator-2'
    static_configs:
      - targets: ['nav-calculator-2:8080']
        labels:
          service: 'nav-calculator'
          instance: 'nav-calculator-2'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8080']
        labels:
          service: 'notification-service'
